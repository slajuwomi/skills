<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- TOPIC_TITLE --></title>
  <style>
    :root {
      --text: #1a1a1a;
      --muted: #555;
      --border: #ddd;
      --code-bg: #f5f5f5;
      --accent: #2563eb;
      --max-width: 720px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e8e8e8;
        --muted: #aaa;
        --border: #444;
        --code-bg: #1e1e1e;
        --accent: #60a5fa;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: var(--text);
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    header h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      line-height: 1.3;
    }

    header .meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    section {
      margin-bottom: 2.5rem;
    }

    h2 {
      font-size: 1.25rem;
      margin: 0 0 1rem;
      padding-bottom: 0.25rem;
      border-bottom: 1px solid var(--border);
    }

    h3 {
      font-size: 1rem;
      margin: 1.5rem 0 0.5rem;
    }

    p { margin: 0 0 1rem; }

    dl {
      margin: 0;
    }

    dt {
      font-weight: 600;
      margin-top: 1rem;
    }

    dt:first-child { margin-top: 0; }

    dd {
      margin: 0.25rem 0 0 0;
      color: var(--muted);
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    code {
      font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, monospace;
      font-size: 0.875em;
    }

    pre code {
      font-size: inherit;
    }

    ol, ul {
      margin: 0 0 1rem;
      padding-left: 1.5rem;
    }

    li { margin-bottom: 0.5rem; }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .callout {
      background: var(--code-bg);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      margin: 1rem 0;
      border-radius: 0 6px 6px 0;
    }

    .step-num {
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1><!-- TOPIC_TITLE --></h1>
    <p class="meta">Generated <!-- DATE --> · Learning mode guide</p>
  </header>

  <section id="overview">
    <h2>Overview</h2>
    <!-- One-paragraph plain-language summary of the topic -->
  </section>

  <section id="concepts">
    <h2>Core concepts</h2>
    <!-- Use <dl> for term/definition pairs when introducing technical terms -->
    <!--
    <dl>
      <dt>Term</dt>
      <dd>Plain-language definition.</dd>
    </dl>
    -->
  </section>

  <section id="worked-example">
    <h2>Worked example</h2>
    <!-- Complete, copy-pasteable example -->
    <!--
    <pre><code>// example code here</code></pre>
    <ol>
      <li><span class="step-num">Step 1:</span> Explain what happens.</li>
      <li><span class="step-num">Step 2:</span> Explain the next part.</li>
    </ol>
    -->
  </section>

  <section id="official-docs">
    <h2>Official documentation</h2>
    <ul>
      <!-- Verified links only — no guessed URLs -->
      <!-- <li><a href="https://...">Source name — what it covers</a></li> -->
    </ul>
  </section>

  <section id="common-mistakes">
    <h2>Common mistakes</h2>
    <!-- Optional: pitfalls and how to avoid them -->
  </section>

  <section id="try-it">
    <h2>Try it yourself</h2>
    <!-- Optional: a small exercise for the reader -->
  </section>
</body>
</html>
